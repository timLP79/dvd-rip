services:
  dvd-rip:
    build: .
    container_name: dvd-rip
    ports:
      - "8000:8000"
    devices:
      - "${DVD_DEVICE:-/dev/sr0}:/dev/sr0"
      # MakeMKV (Blu-ray) reads the drive through its SCSI-generic node, not /dev/sr0.
      # Map the host's matching /dev/sgN. Find it with:
      #   ls /sys/block/sr0/device/scsi_generic/
      - "${BD_SG_DEVICE:-/dev/sg1}:/dev/sg1"
    volumes:
      - "${OUTPUT_DIR:-./output}:/output"
      - "${DATA_DIR:-./data}:/data"
    environment:
      DVD_DEVICE: /dev/sr0
      OUTPUT_ROOT: /output
      LIBRARY_DB: /data/library.db
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      CDROM_GID: "${CDROM_GID:-24}"
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      MAKEMKV_APP_KEY: "${MAKEMKV_APP_KEY:-}"
      MAKEMKV_SCRATCH: /data/scratch
    group_add:
      - "${CDROM_GID:-24}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    # On-demand only: do not auto-start on host boot / Docker daemon restart.
    # Start with `make up` (or `make up-d`); stop with `make down` (or Ctrl-C).
    restart: "no"
