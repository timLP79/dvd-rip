name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # Single source of truth with `make test`. Listing test deps here as well
        # let the two drift: the Makefile's venv was missing pytest-asyncio and
        # respx entirely, so `make test` could not even collect the suite while
        # CI stayed green.
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v
