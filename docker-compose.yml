services:
  dvd-rip:
    build: .
    container_name: dvd-rip
    ports:
      - "8000:8000"
    devices:
      - "${DVD_DEVICE:-/dev/sr0}:/dev/sr0"
      # MakeMKV (Blu-ray) reads the drive through its SCSI-generic node, not /dev/sr0.
      # The container shares the HOST sysfs, so MakeMKV derives the sg node name from
      # /sys/block/sr0/device/scsi_generic/ (a host name, e.g. sg0) and opens that exact
      # path. The container node must therefore match the host node — map BD_SG_DEVICE to
      # the SAME path on both sides, never a fixed target. A hardcoded target (e.g. sg1)
      # breaks whenever the host enumerates the drive as a different /dev/sgN (which shifts
      # across reboots/USB reconnects). BD_SG_DEVICE is auto-detected by the Makefile.
      #   ls /sys/block/sr0/device/scsi_generic/   # shows the host sg name
      - "${BD_SG_DEVICE:-/dev/sg0}:${BD_SG_DEVICE:-/dev/sg0}"
    volumes:
      - "${OUTPUT_DIR:-./output}:/output"
      - "${DATA_DIR:-./data}:/data"
    environment:
      DVD_DEVICE: /dev/sr0
      OUTPUT_ROOT: /output
      LIBRARY_DB: /data/library.db
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      CDROM_GID: "${CDROM_GID:-24}"
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      MAKEMKV_APP_KEY: "${MAKEMKV_APP_KEY:-}"
      MAKEMKV_SCRATCH: /data/scratch
      # Drive id to run in standard (non-LibreDrive) mode — avoids the SDF 100%-CPU
      # hang on non-LibreDrive drives. Set in .env to your drive id. See entrypoint.sh.
      MAKEMKV_SDF_STOP: "${MAKEMKV_SDF_STOP:-}"
      # Phone access (see README "Phone access"). Unset APP_PASSWORD = no login;
      # unset VAPID_* = Web Push disabled. Generate with `make secrets`.
      APP_PASSWORD: "${APP_PASSWORD:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
    extra_hosts:
      # WORKAROUND (dvd-rip-br7): makemkv.com's domain registration lapsed, so its DNS
      # returns SERVFAIL under DNSSEC validation. Pinning any reachable IP keeps a stray
      # makemkv.com lookup from hanging makemkvcon on a slow DNS failure (the real fix
      # is app_UpdateEnable=0 + sdf_Stop, which stop it contacting the server at all).
      # 88.212.208.67 is the current registrar parking IP; override via MAKEMKV_HOST_IP.
      # Remove this block once MakeMKV restores their domain/DNS.
      - "makemkv.com:${MAKEMKV_HOST_IP:-88.212.208.67}"
      - "www.makemkv.com:${MAKEMKV_HOST_IP:-88.212.208.67}"
    group_add:
      - "${CDROM_GID:-24}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    # On-demand only: do not auto-start on host boot / Docker daemon restart.
    # Start with `make up` (or `make up-d`); stop with `make down` (or Ctrl-C).
    restart: "no"
